<!DOCTYPE html>
<html lang="en" data-mode="night">
  <head>
    <meta charset="utf-8">
    <title>Signal K info display</title>
    <script src="./infodisplay.js" type="text/javascript"></script>
    <link rel="icon" type="image/png" href="./icon.png">
    <style>
      ::-webkit-scrollbar {
        display: none;
      }

      /*
        Semantic palette (SPEC: Environment & Theme). The canvas stays
        dark in both modes — there is no white mode. Day mode fights
        glare with brighter, more saturated semantic colors and text;
        night mode dims them to protect rhodopsin. The page boots in
        night mode as the safe default and passively follows the
        Signal K `environment.mode` delta, which flips `data-mode` on
        this root element.
      */
      :root {
        /* Base Canvas (constant) */
        --bg-base: #080a0c;
        --bg-panel: #111414;
        --bg-panel-muted: #0a0c0c;
      }
      :root[data-mode="day"] {
        --color-green: #8dfcbb;
        --color-green-rgb: 141, 252, 187;
        --color-teal: #66c6db;
        --color-teal-rgb: 102, 198, 219;
        --color-orange: #fca847;
        --color-orange-rgb: 252, 168, 71;
        --color-red: #ff5e5e;
        --color-red-rgb: 255, 94, 94;
        --color-grey: #666666;
        --color-grey-rgb: 102, 102, 102;

        --text-main: #ffffff;
        --text-muted: #a0a0b5;
      }
      :root[data-mode="night"] {
        --color-green: #4a7555;
        --color-green-rgb: 74, 117, 85;
        --color-teal: #33616b;
        --color-teal-rgb: 51, 97, 107;
        --color-orange: #8a5318;
        --color-orange-rgb: 138, 83, 24;
        --color-red: #8f3333;
        --color-red-rgb: 143, 51, 51;
        --color-grey: #333333;
        --color-grey-rgb: 51, 51, 51;

        --text-main: #c4c4c4;
        --text-muted: #666677;
      }

      /*
        Theme classes (SPEC: Visual Aesthetic). Each assigns the local
        --theme-color triplet used by panel framing and applies an
        ultra-faint background tint of that color.
      */
      .theme-green {
        --theme-color: var(--color-green);
        --theme-color-rgb: var(--color-green-rgb);
      }
      .theme-teal {
        --theme-color: var(--color-teal);
        --theme-color-rgb: var(--color-teal-rgb);
      }
      .theme-orange {
        --theme-color: var(--color-orange);
        --theme-color-rgb: var(--color-orange-rgb);
      }
      .theme-red {
        --theme-color: var(--color-red);
        --theme-color-rgb: var(--color-red-rgb);
      }
      .theme-offline {
        --theme-color: var(--color-grey);
        --theme-color-rgb: var(--color-grey-rgb);
      }

      body {
        margin: 0px;
        padding: 0px;
        background-color: #000000;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100vw;
        height: 100vh;
        margin: 0px;
        padding: 0px;
        border: 0px;
        background-color: #000000;
        transition: opacity 0.3s ease-in-out;
        overflow: hidden;
        opacity: 1;
      }
      iframe#next {
        opacity: 0;
      }

      /*
        Shared panel framing (SPEC: Visual Aesthetic): strictly flat
        (border-radius 0, no shadows, no gradients), a faint
        semi-transparent inner border, and 2px corner brackets drawn
        with pseudo-elements to simulate hardware mounting brackets.
        Panels are opaque: the ultra-faint theme tint is composited
        over the dark base with color-mix (plain fallback first) so
        the dashboard behind never bleeds through the text.
      */
      .notification,
      #link-console {
        position: relative;
        box-sizing: border-box;
        border: 1px solid rgba(var(--theme-color-rgb), 0.3);
        border-radius: 0;
        background-color: var(--bg-panel);
        background-color: color-mix(in srgb, var(--theme-color) 8%, var(--bg-panel));
      }
      .notification::before,
      #link-console::before {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        width: 14px;
        height: 14px;
        border-top: 2px solid var(--theme-color);
        border-left: 2px solid var(--theme-color);
      }
      .notification::after,
      #link-console::after {
        content: '';
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 14px;
        height: 14px;
        border-bottom: 2px solid var(--theme-color);
        border-right: 2px solid var(--theme-color);
      }

      /*
        Notifications overlay: a fixed bottom-right stack of bracketed
        panels. The JS assigns each panel a theme class (color rung:
        green=normal/nominal, teal=alert, orange=warn, red=alarm/
        emergency) plus its state class. Only warn/alarm/emergency
        pulse; alert/normal/nominal stay steady. Alpha oscillation of
        the border and tint only — no glows.
      */
      #notifications {
        position: fixed;
        bottom: 1.6vh;
        right: 1.6vw;
        display: flex;
        flex-direction: column;
        gap: clamp(6px, 1.2vh, 14px);
        max-width: clamp(280px, 38vw, 640px);
        z-index: 10;
        pointer-events: none;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .notification {
        padding: clamp(8px, 1.8vh, 18px) clamp(12px, 2vw, 24px);
        animation: ntf-enter 0.3s ease-out;
      }
      .notification.warn {
        animation: ntf-enter 0.3s ease-out,
          ntf-pulse 1.6s ease-in-out infinite;
      }
      .notification.alarm {
        animation: ntf-enter 0.3s ease-out,
          ntf-pulse 1.1s ease-in-out infinite;
      }
      .notification.emergency {
        animation: ntf-enter 0.3s ease-out,
          ntf-pulse 0.7s ease-in-out infinite;
      }
      @keyframes ntf-enter {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes ntf-pulse {
        0%, 100% {
          border-color: rgba(var(--theme-color-rgb), 0.3);
          background-color: color-mix(in srgb, var(--theme-color) 8%, var(--bg-panel));
        }
        50% {
          border-color: rgba(var(--theme-color-rgb), 0.9);
          background-color: color-mix(in srgb, var(--theme-color) 20%, var(--bg-panel));
        }
      }
      /* Header/label: uppercase, small, bold, tracked out (SPEC 6) */
      .ntf-tag {
        font-size: clamp(0.85rem, 2vh, 1.1rem);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--theme-color);
        margin-bottom: clamp(2px, 0.6vh, 6px);
      }
      /* Data value: monospace, tabular numerals, --text-main (SPEC 6) */
      .ntf-msg {
        font-family: ui-monospace, 'Fira Code', monospace;
        font-variant-numeric: tabular-nums;
        font-size: clamp(1.25rem, 3.4vh, 2.6rem);
        line-height: 1.2;
        color: var(--text-main);
        overflow-wrap: anywhere;
      }

      /*
        Connection status pseudo-console (SPEC: Terminal Logs): a
        3-column (Timestamp | Message | Status) monospace log of link
        events, fixed top-left over the displayed dashboard. Timestamps
        are UTC (HH:MM:SSZ). The JS keeps it a circular buffer of at
        most 5 rows, and clears it entirely once the link is back up —
        the console exists to make dropouts visible, so a healthy
        connection leaves no trace on screen. Base framing is
        theme-offline (grey); status brackets use the semantic colors.
      */
      #link-console {
        top: 1.6vh;
        left: 1.6vw;
        display: grid;
        gap: 2px;
        padding: clamp(6px, 1.2vh, 12px) clamp(10px, 1.6vw, 16px);
        font-family: ui-monospace, 'Fira Code', monospace;
        font-variant-numeric: tabular-nums;
        font-size: clamp(0.6rem, 1.4vh, 0.85rem);
        max-width: clamp(240px, 46vw, 420px);
        z-index: 10;
        pointer-events: none;
      }
      /* Nothing logged (link is up): don't show an empty frame */
      #link-console:empty {
        display: none;
      }
      .console-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        column-gap: 12px;
        align-items: baseline;
      }
      .console-ts {
        color: var(--text-muted);
        white-space: nowrap;
      }
      .console-msg {
        color: var(--text-main);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .console-status {
        color: var(--color-green);
        text-align: right;
        white-space: nowrap;
      }
      .console-status.warn {
        color: var(--color-orange);
      }
      .console-status.fail {
        color: var(--color-red);
      }
    </style>
  </head>
  <body>
    <iframe allow="autoplay,fullscreen" id="current"></iframe>
    <iframe allow="autoplay,fullscreen" id="next"></iframe>
    <div id="link-console" class="theme-offline"></div>
    <div id="notifications"></div>
  </body>
</html>
