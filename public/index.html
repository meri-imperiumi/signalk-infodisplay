<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Signal K info display</title>
    <script src="./infodisplay.js" type="text/javascript"></script>
    <link rel="icon" type="image/png" href="./icon.png">
    <style>
      ::-webkit-scrollbar {
        display: none;
      }

      body {
        margin: 0px;
        padding: 0px;
        background-color: #000000;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100vw;
        height: 100vh;
        margin: 0px;
        padding: 0px;
        border: 0px;
        background-color: #000000;
        transition: opacity 0.3s ease-in-out;
        overflow: hidden;
        opacity: 1;
      }
      iframe#next {
        opacity: 0;
      }
      /*
        Notifications overlay (SPEC: same HUD language as
        ../signalk-status-tiles). A fixed bottom-right stack of emissive
        panels: dark color-tinted fill, color-tinted border + glow,
        angular clip-path corners, condensed uppercase severity tag. Only
        warn/alarm/emergency pulse; alert/normal/nominal stay steady
        (alert is below the warn rung, like status-tiles' green). Colors
        are status-tiles' Grafana dark-theme palette (STATE_COLOR in
        st-tile-grid.js) — green #73bf69, amber #ffaa00, red #f2495c —
        so the two never disagree on meaning. alert, which status-tiles
        collapses onto green, keeps its own rung here: a 50/50 blend of
        the green and the amber.
      */
      #notifications {
        position: fixed;
        bottom: 1.6vh;
        right: 1.6vw;
        display: flex;
        flex-direction: column;
        gap: 1.2vh;
        max-width: 38vw;
        z-index: 10;
        pointer-events: none;
        font-family: "Eurostile", "Bank Gothic", "Oswald", system-ui, sans-serif;
      }
      .notification {
        /* Defensive base color (status-tiles' fallback blue); in
         * practice the JS always assigns a normal/nominal/warn/alarm/
         * emergency class, so this only shows for the brief moment
         * before a state is set. */
        --c: #6cb7f2;
        --c-rgb: 108, 183, 242;
        position: relative;
        box-sizing: border-box;
        padding: 1.8vh 2.2vw 1.8vh 1.6vw;
        color: var(--c);
        background: rgba(var(--c-rgb), 0.15);
        border: 1px solid var(--c);
        box-shadow:
          inset 0 0 0 1px rgba(var(--c-rgb), 0.4),
          0 0 3.6vh rgba(var(--c-rgb), 0.3);
        /* Angular corner, matching the status-tiles clip-path idiom. */
        clip-path: polygon(
          0 0, calc(100% - 2vh) 0, 100% 2vh, 100% 100%,
          2vh 100%, 0 calc(100% - 2vh)
        );
        opacity: 1;
        transition: opacity 0.3s ease-in-out;
      }
      .notification.normal,
      .notification.nominal {
        /* Grafana success green, as in status-tiles' STATE_COLOR. */
        --c: #73bf69;
        --c-rgb: 115, 191, 105;
      }
      /*
        Signal K's ladder is nominal -> alert -> warn -> alarm ->
        emergency. `alert` is "heads up" — below a warning — so it gets
        its own color between green and amber (and no pulse), distinct
        from `warn`'s amber. Mirrors status-tiles, which maps alert to
        green; here we can't go fully green (the overlay only exists to
        surface things worth seeing), but alert must read as milder than
        warn. The old hue ramp put alert at hue 84, midway between green
        130 and amber 38; with the fixed Grafana palette the equivalent
        is a 50/50 blend of the green #73bf69 and the amber #ffaa00.
      */
      .notification.alert {
        --c: #b9b535;
        --c-rgb: 185, 181, 53;
      }
      .notification.warn {
        /* Grafana warning yellow. */
        --c: #ffaa00;
        --c-rgb: 255, 170, 0;
        animation: ntf-pulse 1.6s ease-in-out infinite;
      }
      .notification.alarm,
      .notification.emergency {
        /* Grafana critical red. */
        --c: #f2495c;
        --c-rgb: 242, 73, 92;
      }
      .notification.alarm {
        animation: ntf-pulse 1.1s ease-in-out infinite;
      }
      .notification.emergency {
        animation: ntf-pulse 0.7s ease-in-out infinite;
      }
      /* Alpha oscillation only, like status-tiles' pulse keyframes. */
      @keyframes ntf-pulse {
        0%, 100% {
          box-shadow:
            inset 0 0 0 1px rgba(var(--c-rgb), 0.5),
            0 0 3vh rgba(var(--c-rgb), 0.32);
        }
        50% {
          box-shadow:
            inset 0 0 0 1px rgba(var(--c-rgb), 0.75),
            0 0 6vh rgba(var(--c-rgb), 0.55);
        }
      }
      .ntf-tag {
        font-size: 1.7vh;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--c);
        margin-bottom: 0.4vh;
      }
      .ntf-msg {
        font-size: 2.6vh;
        line-height: 1.15;
        letter-spacing: 0.04em;
        /* Plain white regardless of state, like status-tiles' values:
           the message is data, not a judgment — the border, glow, and
           tag carry the state color, and white keeps max contrast on
           the dim display. */
        color: #ffffff;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <iframe allow="autoplay,fullscreen" id="current"></iframe>
    <iframe allow="autoplay,fullscreen" id="next"></iframe>
    <div id="notifications"></div>
  </body>
</html>
